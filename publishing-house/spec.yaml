project:
  slug: "rhel-im-lifestyle-rh1"
  owner_email: "nlager@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "zero_touch"
  intake_type: "new"
  automation_type: "ansible"
  description: "Hands on lab, featuring some of the advanced, day-2, and security tasks around RHEL Image Mode."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1160"
  workflow_id: "1c9f6d0b-63cd-466a-b56f-65383d556600"

spec:
  title: "RHEL Image Mode Lifestyle, preparing for RHEL 11"
  learning_objectives:
    - "Configure automatic system updates for RHEL image-mode systems using scheduled update policies"
    - "Implement system rollback to restore a previous image version after a failed or unwanted update"
    - "Apply CIS security benchmarks to image-mode systems using OpenSCAP profiles"
    - "Verify system compliance status against applied security hardening profiles"
    - "Configure firewall rules within image-mode deployments using standard RHEL firewall tooling"
    - "Deploy containerized applications on a RHEL image-mode host"
    - "Explore sealed images for fully immutable system configurations (if feature is available)"
  modules:
    - id: module-01
      title: "Introduction and Lab Orientation"
      duration_min: 10
      status: not_started
    - id: module-02
      title: "System Updates and Automatic Scheduling"
      duration_min: 20
      status: not_started
    - id: module-03
      title: "System Rollback"
      duration_min: 15
      status: not_started
    - id: module-04
      title: "Security Hardening with OpenSCAP"
      duration_min: 25
      status: not_started
    - id: module-05
      title: "Firewall Configuration"
      duration_min: 15
      status: not_started
    - id: module-06
      title: "Deploying Containerized Applications"
      duration_min: 20
      status: not_started
    - id: module-07
      title: "Sealed Images (Tentative)"
      duration_min: 15
      status: not_started
  environment:
    platform: "rhel-vms"       # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: troshka    # cnv | aws | troshka — troshka for nested virtualization
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student:
      - role: "build-host"
        count: 1
        cpu: 4
        ram_gb: 16
        disk_gb: 100
        os: "rhel-10"

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "none"             # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: ["registry.redhat.io", "cdn.redhat.com", "github.com"]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2
  audience: "intermediate"               # beginner | intermediate | advanced

development:
  automation:
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: "Extends the 'Image Mode is the best mode' lab with deeper coverage of day-2 operations — scheduled automatic updates, OpenSCAP CIS hardening workflows, firewall configuration, and sealed images — as a standalone ~2-hour experience for technical sellers, rather than bundled within a full-lifecycle lab."
    design_overview: "A hands-on zero-touch lab for Red Hat technical sellers and TAMs covering day-2 operational and security aspects of RHEL Image Mode. Participants configure automatic updates, perform rollbacks, apply CIS benchmarks with OpenSCAP, harden firewall rules, deploy containerized applications, and explore sealed images — going deeper on topics introduced in the earlier 'Image Mode is the best mode' lab."
    module_summaries:
      - title: "Introduction and Lab Orientation"
        overview: "Orientation to the lab environment — connect to the web terminal, verify the image-mode baseline with bootc status, and review the lab structure."
      - title: "System Updates and Automatic Scheduling"
        overview: "Configure scheduled automatic updates for a RHEL image-mode system, trigger an update, reboot, and verify the system is running the new image version."
      - title: "System Rollback"
        overview: "Roll back to the previous image version after an update, reboot, and verify the system has been restored to its prior state."
      - title: "Security Hardening with OpenSCAP"
        overview: "Run a CIS compliance scan using OpenSCAP, review findings, remediate selected items, and re-scan to verify improved compliance."
      - title: "Firewall Configuration"
        overview: "Inspect firewalld state, add service and port rules, make rules permanent, and verify enforcement within the image-mode context."
      - title: "Deploying Containerized Applications"
        overview: "Pull and run a containerized application with Podman, verify accessibility, and generate a systemd service for persistence across reboots."
      - title: "Sealed Images (Tentative)"
        overview: "Explore sealed image configuration for fully immutable systems, verify immutability enforcement, and compare behavior to standard image mode."
    rcars_overlap_pct: 98
    rcars_top_matches:
      - title: "Day 2 operations with image mode for Red Hat Enterprise Linux"
        ci_name: "zt-rhelbu.zt-image-mode-day2.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-image-mode-day2.prod"
        relevance_score: 98
        why_it_fits: "Directly targets Day 2 operations for image mode RHEL (bootc), covering OS version switching, rollback, and containerized application deployment."
      - title: "Image Mode is the best mode"
        ci_name: "zt-rhelbu.zt-image-mode-rh1.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-image-mode-rh1.prod"
        relevance_score: 90
        why_it_fits: "Covers the full lifecycle including automatic updates, rollback, OpenSCAP/CIS hardening, firewall configuration, and containerized application deployment within the RHEL Image Mode (bootc) framework."
      - title: "Building & Managing Self-contained Edge Appliances with Red Hat Image Mode and MicroShift"
        ci_name: "published.edge-rhim-microshift.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.edge-rhim-microshift.prod"
        relevance_score: 72
        why_it_fits: "Covers atomic updates, rollback with bootc, OpenSCAP CIS hardening, and containerized application deployment within a RHEL Image Mode context, though focused on edge/MicroShift scenarios."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
